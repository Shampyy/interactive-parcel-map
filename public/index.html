<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Mapa parcel - Jičín</title>

  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- Kontejner pro samotnou mapu -->
  <div id="map"></div>

  <!-- Boční vyjížděcí panel pro detaily parcely -->
  <div id="slide-panel">
    <button id="close-panel">X</button>
    <h2 id="parcel-title">Parcela</h2>
    <p id="parcel-area"></p>
    <p id="parcel-type"></p>
    <p id="parcel-region"></p>
    <p id="parcel-municipality"></p>
  </div>

  <script>
    // Lokální číselník pro druhy pozemků (v RUIAN se téměř nemění, není nutné dynamicky tahat z XML)
    const slovnikDruhu = {
      "2": "Orná půda",
      "5": "Zahrada",
      "7": "Trvalý travní porost",
      "10": "Lesní pozemek",
      "11": "Vodní plocha",
      "13": "Zastavěná plocha a nádvoří",
      "14": "Ostatní plocha"
    };

    // Inicializace MapLibre objektu
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
      center: [15.3533, 50.4377], // Souřadnice: Jičín
      zoom: 14
    });

    // Načtení vrstev a GeoJSON dat až po plném vykreslení mapy
    map.on('load', () => {
      // Definice zdroje dat
      map.addSource('jicin_parcels', { type: 'geojson', data: 'geojson/jicin_parcels.json' });

      // Vrstva 1: Základní výplň polygonů
      map.addLayer({
        id: 'parcels-fill',
        type: 'fill',
        source: 'jicin_parcels',
        paint: {
          'fill-color': '#c8dbe0',
          'fill-opacity': 1
        }
      });

      // Vrstva 2: Černé okraje parcel
      map.addLayer({
        id: 'parcels-outline',
        type: 'line',
        source: 'jicin_parcels',
        paint: {
          'line-color': '#000000',
          'line-width': 1,
        }
      });

      // Vrstva 3: zvýraznění vybrané parcely
      map.addLayer({
        id: 'parcels-selected',
        type: 'fill',
        source: 'jicin_parcels',
        paint: {
          'fill-color': '#024a7e',
          'fill-opacity': 0.2,
        },
        filter: ['==', 'id', '']
      });
    });

    map.on('mouseenter', 'parcels-fill', () => {
      map.getCanvas().style.cursor = 'pointer';
    });
    map.on('mouseleave', 'parcels-fill', () => {
      map.getCanvas().style.cursor = '';
    });

    map.on('click', 'parcels-fill', (e) => {
      if (!e.features || e.features.length === 0) return;

      // Pokud na sebe parcely navrstvují, ta s menší plochou bude navrchu
      const feature = e.features.reduce((smallest, f) =>
              f.properties.area < smallest.properties.area ? f : smallest
      );
      const props = feature.properties;

      map.setFilter('parcels-selected', ['==', 'id', props.id]);
      document.getElementById('slide-panel').classList.add('panel-open');

      // Mapování dat - Druh pozemku přes JS číselník, Katastr a Obec se tahají z GeoJSON vlastností
      const nazevDruhu = slovnikDruhu[props.type] || `Neznámý druh (${props.type})`;
      const nazevKatastru = props.region_name || `KÚ (${props.region})`;
      const nazevObce = props.municipality_name || `Obec (${props.municipality})`;

      // Vložení dat do HTML
      document.getElementById('parcel-title').innerText = `Parcela: ${props.parcel_number}`;
      document.getElementById('parcel-area').innerHTML = `<strong>Výměra:</strong> ${props.area} m²`;
      document.getElementById('parcel-type').innerHTML = `<strong>Druh pozemku:</strong> ${nazevDruhu}`;
      document.getElementById('parcel-region').innerHTML = `<strong>Katastrální území:</strong> ${nazevKatastru} `;
      document.getElementById('parcel-municipality').innerHTML = `<strong>Obec:</strong> ${nazevObce}`;
    });

    // křížek pro zavření panelu a zrušení výběru na mapě
    document.getElementById('close-panel').addEventListener('click', () => {
      document.getElementById('slide-panel').classList.remove('panel-open');
      map.setFilter('parcels-selected', ['==', 'id', '']);
    });

  </script>
</body>
</html>
